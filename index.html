<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Study Desk</title>
<meta name="keywords" content="Tool Hub, Report Tools, Study Tools, AI Tools">
<meta name="author" content="Thanushkar S, Thanu">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a84ff'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<style>
:root{
  --acc:#0a84ff; --txt:#1d1d1f; --sub:#6e6e73; --line:rgba(0,0,0,.09); --hover:rgba(0,0,0,.055);
  --win:rgba(255,255,255,.74); --side:rgba(240,241,246,.62); --bar:rgba(255,255,255,.7);
  --wall:radial-gradient(60% 50% at 15% 10%,#ffb8d9 0,transparent 70%),radial-gradient(55% 55% at 90% 15%,#9ec5ff 0,transparent 70%),radial-gradient(60% 60% at 80% 95%,#c3a1ff 0,transparent 70%),radial-gradient(55% 55% at 10% 95%,#8fe6ff 0,transparent 70%),#e9edf6;
}
[data-theme=dark]{
  --txt:#f5f5f7; --sub:#a1a1a6; --line:rgba(255,255,255,.11); --hover:rgba(255,255,255,.09);
  --win:rgba(34,34,38,.76); --side:rgba(24,24,28,.6); --bar:rgba(20,20,24,.6);
  --wall:radial-gradient(60% 50% at 15% 10%,#5b2a6e 0,transparent 70%),radial-gradient(55% 55% at 90% 15%,#1d3f8f 0,transparent 70%),radial-gradient(60% 60% at 80% 95%,#3b2a8f 0,transparent 70%),radial-gradient(55% 55% at 10% 95%,#0f5c6b 0,transparent 70%),#0c0d14;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--wall) fixed;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.glass{backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%)}

/* menu bar */
.menubar{position:fixed;inset:0 0 auto 0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line);font-size:13px;z-index:50}
.menubar b{font-weight:600}.menubar div{display:flex;align-items:center;gap:16px}
.menubar button{font-size:15px;opacity:.8}.menubar button:hover{opacity:1}

/* window */
.win{position:fixed;top:46px;bottom:100px;left:50%;transform:translateX(-50%);width:min(1080px,calc(100% - 32px));display:grid;grid-template-columns:220px 1fr;background:var(--win);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.12);overflow:hidden}
.side{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.lights{display:flex;gap:8px;padding:0 8px 14px}.lights i{width:12px;height:12px;border-radius:50%}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.side h6{font-size:11px;font-weight:600;color:var(--sub);padding:12px 10px 4px}
.si{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;text-align:left;width:100%}
.si:hover{background:var(--hover)}
.si.on{background:var(--acc);color:#fff}
.si .mini{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;background:linear-gradient(145deg,var(--a),var(--b));flex:none}
.si .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .c{font-size:12px;opacity:.6}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tool{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.tool h2{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--hover);border-radius:8px;padding:2px}
.seg button{padding:3px 10px;border-radius:6px;font-size:15px;line-height:1.3}
.seg button.on{background:var(--win);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.search{position:relative;width:min(240px,42%)}
.search input{width:100%;padding:6px 40px 6px 30px;border-radius:8px;border:1px solid var(--line);background:var(--hover);color:var(--txt);font:inherit;outline:0}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(10,132,255,.25)}
.search::before{content:"🔍";position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:11px inherit;color:var(--sub);pointer-events:none}
.scroll{flex:1;overflow-y:auto;padding:18px 20px 24px}
.hello{margin-bottom:6px}.hello h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.hello p{color:var(--sub);margin-top:2px}
.sec{margin-top:22px}.sec h3{font-size:13px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:6px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.app{position:relative}
.app a{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 8px;border-radius:12px;text-align:center}
.app a:hover,.app a:focus-visible{background:var(--hover)}
.tile{width:62px;height:62px;border-radius:15px;display:grid;place-items:center;font-size:32px;background:linear-gradient(145deg,var(--a),var(--b));box-shadow:0 6px 14px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .15s}
.app a:hover .tile{transform:translateY(-3px) scale(1.06)}
.nm{font-size:12.5px;font-weight:500;line-height:1.25}.nm small{display:none;color:var(--sub);font-weight:400;font-size:12px}
.star{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;font-size:14px;color:var(--sub);opacity:0;transition:.15s}
.app:hover .star,.star:focus-visible,.star.on{opacity:1}.star.on{color:#ffb020}
.star:hover{background:var(--hover)}
.grid.list{grid-template-columns:1fr;gap:0}
.list .app a{flex-direction:row;gap:12px;padding:7px 10px;text-align:left}
.list .tile{width:36px;height:36px;font-size:19px;border-radius:9px}
.list .nm small{display:block}.list .star{top:12px;right:12px}
.empty{text-align:center;color:var(--sub);padding:60px 20px}.empty div{font-size:44px;margin-bottom:8px}

/* dock */
.dock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:8px;padding:8px 10px;background:var(--bar);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px rgba(0,0,0,.2);z-index:40}
.di{position:relative;width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:linear-gradient(145deg,var(--a),var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 8px rgba(0,0,0,.2);transform-origin:bottom;transition:transform .12s ease-out}
.di.on::before{content:"";position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--txt);opacity:.7}
.di::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--win);border:1px solid var(--line);padding:3px 9px;border-radius:6px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;color:var(--txt);font-size:12px}
.di:hover::after,.di:focus-visible::after{opacity:1}
.dsep{width:1px;height:38px;background:var(--line);align-self:center}

/* toast + about */
.toast{position:fixed;top:40px;right:14px;width:310px;padding:12px 14px;display:flex;gap:11px;background:var(--win);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:60;transform:translateX(120%);transition:transform .45s cubic-bezier(.2,.9,.3,1)}
.toast.show{transform:none}.toast .ic{font-size:26px}.toast p{font-size:12.5px;color:var(--sub);margin-top:2px}.toast b{font-size:13px}
.toast button{align-self:flex-start;margin-left:auto;color:var(--sub);font-size:16px}
dialog{margin:auto;width:320px;border:1px solid var(--line);border-radius:16px;background:var(--win);color:var(--txt);padding:26px 22px 20px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.28);backdrop-filter:blur(3px)}
.av,.ph{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:grid;place-items:center;font-size:32px;font-weight:600;color:#fff;background:linear-gradient(145deg,#4fa8ff,#5a4fe0)}
dialog h3{font-size:18px}dialog .role{color:var(--sub);font-size:13px;margin-bottom:16px}
.links{border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left}
.links a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}.links a:last-child{border:0}.links a:hover{background:var(--hover)}
.close{margin-top:14px;padding:6px 22px;border-radius:8px;background:var(--acc);color:#fff;font-weight:500}

@media(max-width:760px){
  .win{grid-template-columns:1fr;grid-template-rows:auto 1fr;bottom:12px;top:40px;width:calc(100% - 16px)}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:4px}
  .side h6,.lights,.si .c{display:none}.si{width:auto;flex:none;padding:6px 10px}
  .dock,.tool h2{display:none}.search{width:100%}.toast{width:calc(100% - 20px)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="menubar glass">
  <div><span>🎓</span><b>Study Desk</b></div>
  <div>
    <button id="btn-search" aria-label="Search">🔍</button>
    <button id="btn-theme" aria-label="Toggle dark mode">🌙</button>
    <span id="clock"></span>
  </div>
</header>

<main class="win glass" aria-label="Digital Study Desk">
  <nav class="side" id="side" aria-label="Folders"></nav>
  <section class="main">
    <div class="tool">
      <h2 id="title">All Apps</h2>
      <div class="seg" role="group" aria-label="View">
        <button id="v-grid" aria-label="Icon view" title="Icon view">▦</button>
        <button id="v-list" aria-label="List view" title="List view">☰</button>
      </div>
      <label class="search"><input id="q" type="search" placeholder="Search apps" autocomplete="off" aria-label="Search apps"><kbd>⌘K</kbd></label>
    </div>
    <div class="scroll" id="content"></div>
  </section>
</main>

<nav class="dock glass" id="dock" aria-label="Dock"></nav>

<aside class="toast glass" id="toast" role="status">
  <span class="ic">📚</span>
  <div><b>Learn first, shortcut never</b><p>Check your university's policies and use these tools responsibly.</p></div>
  <button id="toast-x" aria-label="Dismiss">✕</button>
</aside>

<dialog id="about">
  <img class="av" src="Profile.jpg" alt="Profile photo" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'ST'}))">
  <h3>Sivakumar Thanushkar</h3>
  <p class="role">Builder of this desk</p>
  <div class="links">
    <a href="mailto:mrkthanuts@gmail.com">📧 Email</a>
    <a href="https://github.com/ThanushkarSiva1238" target="_blank" rel="noopener">🐙 GitHub</a>
    <a href="https://www.linkedin.com/in/thanushkarsivakumar/" target="_blank" rel="noopener">💼 LinkedIn</a>
  </div>
  <button class="close" id="about-x">Done</button>
</dialog>

<script src="index.js"></script>
</body>
</html>
